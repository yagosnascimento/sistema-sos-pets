# Banco H2 em memória, usado apenas para rodar/testar a imagem Docker sem depender de um Postgres externo
spring.datasource.url=jdbc:h2:mem:sospets;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# data.sql do projeto está incompleto (depende de dados que não existem no arquivo), então fica desativado aqui
spring.sql.init.mode=never
spring.jpa.show-sql=false
